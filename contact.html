<!DOCTYPE html>
<html>
    <head>
        <title>Coffe So Good</title>
        <link rel="stylesheet" href="css/style.css"/>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
    </head>
    <body>
        <div class="header">
            <img src="img/coffee.jpg" alt="head-logo" class="head-logo">
            <h2 class="head-title">COFFEELIT</h2>
       </div>
        <div class="navigation-nav">
            <h1 class="nav-name">=</h1>
        <ul class="nav">
            <li><a href="index.html" class="navigation">Home</a></li>
            <li><a href="product.html" class="navigation">Product</a></li>
            <li><a href="about.html" class="navigation">About Us</a></li>
            <li><a href="contact.html" class="navigation">Contact Us</a></li>
        </ul>
       </div>
       <div class="contact">
        <form>
        <div class="contact-group">
            <label class="contact-group-label">Username:</label>
            <div class="cg">
                <img src="img/profile icon.png" class="icon">
                <input class="contact-group-input" type="text" name="username" required placeholder="masukan username">
            </div>
        </div>
        <div class="contact-group">
            <label><Email: class="contact-group-label">Email:</label>
            <div class="cg">
                <img src="img/email icon.png" class="icon">
                <input class="contact-group-input" type="email" name="email" required placeholder="masukan email">
            </div>
        </div>
        <div class="contact-group">
            <label class="contact-group-label" placeholder="masukan message">Message:</label><br>
            <div class="cg">
                <img src="img/message icon.png" class="icon">
                <textarea name="message" id="message" cols="50" rows="10" placeholder="ketik pesan"></textarea>
            </div>
        </div>
        <button type="submit" class="send">Send</button>
       </form>
       </div>
       <div class="lgo">
        <img src="img/Barista illustration for logo.jpeg" width="100px" class="lg">
       </div>
    </body>
